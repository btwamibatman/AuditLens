services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - APP_NAME=${APP_NAME:-AuditLens}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - ENABLE_AUTH=${ENABLE_AUTH:-false}
      - ENABLE_UPLOADS=${ENABLE_UPLOADS:-false}
      - ENABLE_AI=${ENABLE_AI:-false}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me-please-32-bytes-min}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-10}
      # CQA / Gemini & Dataset API settings (from root .env)
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_THINKING_LEVEL=${GEMINI_THINKING_LEVEL:-medium}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-120}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-3}
      - LLM_BATCH_CONCURRENCY=${LLM_BATCH_CONCURRENCY:-4}
      - LLM_PRICE_INPUT_PER_1M=${LLM_PRICE_INPUT_PER_1M:-1.50}
      - LLM_PRICE_OUTPUT_PER_1M=${LLM_PRICE_OUTPUT_PER_1M:-7.50}
      - DATASET_API_URL=${DATASET_API_URL:-}
      - DATASET_TIMEOUT_SECONDS=${DATASET_TIMEOUT_SECONDS:-30}
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Опциональный PostgreSQL для проектов, требующих реляционную СУБД:
  # Чтобы включить: раскомментируйте блок ниже и укажите DATABASE_URL в .env:
  # DATABASE_URL=postgresql+psycopg://app:app@db:5432/app
